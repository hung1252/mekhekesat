<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danh sách bài viết - Mekhekesat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <div class="max-w-5xl mx-auto p-6">
    <div class="flex justify-between items-center mb-8">
      <h1 class="text-3xl font-bold">📚 Danh sách bài viết</h1>
      <a href="dang-bai.html" class="bg-emerald-600 text-white px-6 py-3 rounded-2xl hover:bg-emerald-700">
        ✍️ Đăng bài mới
      </a>
    </div>

    <div id="postsList" class="space-y-8">
      <!-- Bài viết sẽ load vào đây -->
    </div>
  </div>

  <script>
    const supabaseUrl = 'https://qypxbomomhrfskfwjhid.supabase.co';
    const supabaseAnonKey = 'sb_publishable__-gEe6Tl9zX6Detpskn31A_r_8hnm7J';

    const supabase = Supabase.createClient(supabaseUrl, supabaseAnonKey);

    async function loadPosts() {
      const { data, error } = await supabase
        .from('posts')
        .select('*')
        .order('id', { ascending: false });

      const container = document.getElementById('postsList');
      container.innerHTML = '';

      if (error) {
        container.innerHTML = `<p class="text-red-500 text-center py-10">Lỗi tải dữ liệu: ${error.message}</p>`;
        return;
      }

      if (!data || data.length === 0) {
        container.innerHTML = `<p class="text-gray-500 text-center py-10">Chưa có bài viết nào. Hãy đăng bài đầu tiên!</p>`;
        return;
      }

      data.forEach(post => {
        const postHTML = `
          <div class="bg-white rounded-3xl shadow overflow-hidden">
            <div class="p-6">
              <div class="flex items-center gap-3 mb-4">
                <span class="px-4 py-1.5 text-sm font-medium bg-emerald-100 text-emerald-700 rounded-full">
                  ${post.type || 'Khác'}
                </span>
                <span class="text-gray-500 text-sm">${new Date(post.created_at || Date.now()).toLocaleDateString('vi-VN')}</span>
              </div>
              
              <h2 class="text-2xl font-bold mb-3">${post.title}</h2>
              <p class="text-gray-600 line-clamp-4">${post.content}</p>
            </div>
            
            ${post.image_url ? `
            <img src="${post.image_url}" class="w-full h-64 object-cover">
            ` : ''}
            
            <div class="p-6 flex gap-4">
              ${post.link ? `<a href="${post.link}" target="_blank" class="text-blue-600 hover:underline">🔗 Link liên kết</a>` : ''}
            </div>
          </div>
        `;
        container.innerHTML += postHTML;
      });
    }

    loadPosts();
  </script>
</body>
</html>
