<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danh sách bài viết - Mekhekesat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <div class="max-w-5xl mx-auto p-6">
    <div class="flex justify-between items-center mb-8">
      <h1 class="text-3xl font-bold">📚 Danh sách bài viết</h1>
      <a href="dang-bai.html" 
         class="bg-emerald-600 text-white px-6 py-3 rounded-2xl hover:bg-emerald-700 flex items-center gap-2">
        ✍️ Đăng bài mới
      </a>
    </div>

    <div id="postsList" class="space-y-8">
      <!-- Bài viết sẽ hiện ở đây -->
    </div>
  </div>

  <script>
    const supabaseUrl = 'https://qypxbomomhrfskfwjhid.supabase.co';
    const supabaseAnonKey = 'sb_publishable__-gEe6Tl9zX6Detpskn31A_r_8hnm7J';

    const supabase = Supabase.createClient(supabaseUrl, supabaseAnonKey);

    async function loadPosts() {
      const { data, error } = await supabase
        .from('posts')
        .select('*')
        .order('id', { ascending: false });

      const container = document.getElementById('postsList');
      container.innerHTML = '';

      if (error) {
        container.innerHTML = `<p class="text-red-500 text-center py-20">Lỗi: ${error.message}</p>`;
        return;
      }

      if (!data || data.length === 0) {
        container.innerHTML = `<p class="text-gray-500 text-center py-20">Chưa có bài viết nào. Hãy đăng bài đầu tiên!</p>`;
        return;
      }

      data.forEach(post => {
        const html = `
          <div class="bg-white rounded-3xl shadow-md overflow-hidden">
            <div class="p-6">
              <span class="inline-block px-4 py-1 bg-emerald-100 text-emerald-700 text-sm rounded-full">${post.type || 'Khác'}</span>
              <h2 class="text-2xl font-bold mt-3 mb-2">${post.title}</h2>
              <p class="text-gray-600 line-clamp-4">${post.content}</p>
            </div>
            ${post.image_url ? `<img src="${post.image_url}" class="w-full h-64 object-cover">` : ''}
            <div class="p-6 pt-0">
              ${post.link ? `<a href="${post.link}" target="_blank" class="text-blue-600 hover:underline">🔗 Xem link ngoài</a>` : ''}
            </div>
          </div>
        `;
        container.innerHTML += html;
      });
    }

    loadPosts();
  </script>
</body>
</html>
