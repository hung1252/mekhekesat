<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danh sách bài viết - Mekhekesat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50">
  <div class="max-w-5xl mx-auto p-6">
    <h1 class="text-3xl font-bold mb-8">📚 Danh sách bài viết</h1>
    
    <div id="postsList" class="space-y-6">
      <!-- Bài viết sẽ được load vào đây -->
    </div>
  </div>

  <script>
    const supabaseUrl = 'https://qypxbomomhrfskfwjhid.supabase.co';
    const supabaseAnonKey = 'sb_publishable__-gEe6Tl9zX6Detpskn31A_r_8hnm7J';

    const supabase = Supabase.createClient(supabaseUrl, supabaseAnonKey);

    async function loadPosts() {
      const { data, error } = await supabase
        .from('posts')
        .select('*')
        .order('id', { ascending: false });

      const container = document.getElementById('postsList');
      container.innerHTML = '';

      if (error) {
        container.innerHTML = `<p class="text-red-500">Lỗi tải dữ liệu: ${error.message}</p>`;
        return;
      }

      if (data.length === 0) {
        container.innerHTML = `<p class="text-gray-500">Chưa có bài viết nào.</p>`;
        return;
      }

      data.forEach(post => {
        const div = document.createElement('div');
        div.className = "bg-white p-6 rounded-2xl shadow";
        div.innerHTML = `
          <div class="flex justify-between items-start">
            <div>
              <span class="inline-block px-3 py-1 text-xs font-medium bg-emerald-100 text-emerald-700 rounded-full">${post.type || 'Khác'}</span>
              <h2 class="text-xl font-bold mt-3">${post.title}</h2>
              <p class="text-gray-600 mt-2 line-clamp-3">${post.content.substring(0, 200)}...</p>
            </div>
          </div>
          ${post.image_url ? `<img src="${post.image_url}" class="mt-4 w-full max-h-64 object-cover rounded-xl">` : ''}
          <div class="mt-4 text-sm text-gray-500">
            ${post.link ? `<a href="${post.link}" target="_blank" class="text-blue-600 hover:underline">🔗 Link ngoài</a>` : ''}
          </div>
        `;
        container.appendChild(div);
      });
    }

    // Tự động load khi mở trang
    loadPosts();
  </script>
</body>
</html>
