<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng bài mới - Mekhekesat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .upload-box { transition: all 0.3s; }
    .upload-box:hover { background-color: #f8fafc; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen py-10">
  <div class="max-w-3xl mx-auto bg-white shadow-2xl rounded-3xl overflow-hidden">
    <div class="bg-emerald-600 text-white p-6">
      <h1 class="text-3xl font-bold flex items-center gap-3">
        <i class="fas fa-edit"></i> Đăng bài mới
      </h1>
    </div>

    <form id="postForm" class="p-8 space-y-8">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Loại bài viết <span class="text-red-500">*</span></label>
        <select id="type" required class="w-full px-5 py-3 border border-gray-300 rounded-2xl focus:ring-2 focus:ring-emerald-500 outline-none">
          <option value="">Chọn loại bài</option>
          <option value="lichsu">Lịch sử</option>
          <option value="ditich">Di tích</option>
          <option value="vanhoa">Văn hóa</option>
          <option value="thegioi">Thế giới</option>
          <option value="dail">Danh nhân</option>
          <option value="yte">Y tế</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Tiêu đề <span class="text-red-500">*</span></label>
        <input type="text" id="title" required class="w-full px-5 py-3 border border-gray-300 rounded-2xl focus:ring-2 focus:ring-emerald-500 outline-none">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Nội dung <span class="text-red-500">*</span></label>
        <textarea id="content" rows="14" required class="w-full px-5 py-3 border border-gray-300 rounded-2xl focus:ring-2 focus:ring-emerald-500 outline-none resize-y"></textarea>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Link liên kết ngoài</label>
        <input type="url" id="link" placeholder="https://..." class
